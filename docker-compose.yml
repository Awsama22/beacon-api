# Local PostgreSQL for the Beacon API. Password comes from ~/.config/natoor/postgres-password.
services:
  postgres:
    image: postgres:17-alpine
    container_name: natoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: natoor
      POSTGRES_DB: natoor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - natoor-postgres-data:/var/lib/postgresql/data

secrets:
  postgres_password:
    file: ${HOME}/.config/natoor/postgres-password

volumes:
  natoor-postgres-data:
